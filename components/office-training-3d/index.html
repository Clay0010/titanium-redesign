<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office training · 3D preview</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; background:#f5f6f5; color:#253137; font:15px/1.6 system-ui,sans-serif }
  main { width:min(900px,100%); margin:auto; padding:32px 20px }
  h1 { font-size:24px; margin:0 0 4px; font-weight:600 }
  p { margin:0; color:#626d72 }
  .canvas { background:white; border:1px solid #e4e7e5; border-radius:18px; margin:24px 0 12px }
  office-training { aspect-ratio:1.15 }
</style>
<main>
  <h1>Office training</h1>
  <p>Drag to rotate · Scroll or pinch to zoom · Reset with ↺</p>
  <div class="canvas"><office-training></office-training></div>
  <p>Created in Blender · Interactive GLB preview</p>
</main>
<script type="module" src="./office-training.js"></script>
</html>
